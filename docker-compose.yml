services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novexa_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://novexa:novexa_secret@postgres:5432/novexa_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: novexa_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=novexa
      - POSTGRES_PASSWORD=novexa_secret
      - POSTGRES_DB=novexa_db
    volumes:
      - novexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novexa -d novexa_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: novexa_redis
    ports:
      - "6379:6379"
    volumes:
      - novexa_redisdata:/data
    restart: unless-stopped

volumes:
  novexa_pgdata:
    driver: local
  novexa_redisdata:
    driver: local
